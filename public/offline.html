<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0a09" />
    <title>Sand &amp; Steel — the gates are closed</title>
    <!--
      The offline screen, served by /sw.js when the app shell cannot be reached.
      Deliberately self-contained: inline styles and one inline handler, no font,
      image or script request of any kind — it has to render with no network at all.
      The type stack starts at Cinzel (the game's display face, loaded from Google
      Fonts when online) and falls back to the serif faces already on the device.
    -->
    <style>
      :root {
        --sand-ink: #eddcb6;
        --sand-dim: #b9a684;
        --bronze: #b08d57;
        --bronze-bright: #d8b978;
        --bronze-deep: #7a5c31;
        --stone-deep: #0c0a09;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(1.5rem + env(safe-area-inset-top)) 1.25rem calc(1.5rem + env(safe-area-inset-bottom));
        background-color: var(--stone-deep);
        background-image:
          radial-gradient(circle at 50% 12%, rgba(176, 141, 87, 0.22), transparent 58%),
          radial-gradient(circle at 50% 120%, rgba(120, 92, 49, 0.18), transparent 60%),
          linear-gradient(180deg, #171412 0%, var(--stone-deep) 55%, #090807 100%);
        color: var(--sand-ink);
        font-family: 'Cinzel', 'Trajan Pro', 'Times New Roman', Georgia, serif;
        text-align: center;
        -webkit-font-smoothing: antialiased;
      }

      /* The stone slab: a bronze-ruled panel with a faint chiselled grain. */
      .gate {
        width: 100%;
        max-width: 30rem;
        padding: clamp(1.75rem, 6vw, 2.75rem) clamp(1.25rem, 5vw, 2.25rem);
        border: 1px solid var(--bronze-deep);
        border-radius: 0.35rem;
        background-color: rgba(28, 25, 23, 0.92);
        background-image: repeating-linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.022) 0,
          rgba(255, 255, 255, 0.022) 1px,
          transparent 1px,
          transparent 5px
        );
        box-shadow:
          0 0 0 1px rgba(216, 185, 120, 0.14) inset,
          0 1.5rem 3rem rgba(0, 0, 0, 0.75);
        animation: gate-rise 420ms ease-out both;
      }

      /* A bronze lintel across the threshold. */
      .gate::before {
        content: '';
        display: block;
        width: 4.5rem;
        height: 3px;
        margin: 0 auto clamp(1.1rem, 4vw, 1.6rem);
        background-image: linear-gradient(90deg, transparent, var(--bronze), transparent);
      }

      .eyebrow {
        margin: 0 0 0.85rem;
        color: var(--bronze);
        font-size: clamp(0.62rem, 2.4vw, 0.72rem);
        font-weight: 600;
        letter-spacing: 0.34em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 1rem;
        color: #f6ecd4;
        font-size: clamp(1.3rem, 5.2vw, 1.85rem);
        font-weight: 800;
        line-height: 1.28;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
      }

      .note {
        margin: 0 auto clamp(1.5rem, 5vw, 2rem);
        max-width: 22rem;
        color: var(--sand-dim);
        font-family: 'Rajdhani', 'Segoe UI', system-ui, sans-serif;
        font-size: clamp(0.9rem, 3.6vw, 1rem);
        line-height: 1.6;
      }

      button {
        display: inline-block;
        padding: 0.85rem 1.9rem;
        border: 1px solid var(--bronze-bright);
        border-radius: 0.25rem;
        background-image: linear-gradient(180deg, var(--bronze-bright), var(--bronze));
        color: #1a1208;
        font-family: inherit;
        font-size: clamp(0.78rem, 3.2vw, 0.86rem);
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        cursor: pointer;
        touch-action: manipulation;
        box-shadow: 0 0.5rem 1.25rem rgba(0, 0, 0, 0.55);
        transition: filter 160ms ease, transform 160ms ease;
      }

      button:hover {
        filter: brightness(1.1);
      }

      button:active {
        transform: translateY(1px);
        filter: brightness(0.95);
      }

      button:focus-visible {
        outline: 2px solid var(--bronze-bright);
        outline-offset: 3px;
      }

      @keyframes gate-rise {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .gate {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="gate">
      <p class="eyebrow">Sand &amp; Steel</p>
      <h1>The gates are closed — no connection.</h1>
      <p class="note">Your progress is saved on this device. Reconnect to return to the arena.</p>
      <button type="button" id="retry">Try the gates again</button>
    </main>
    <script>
      document.getElementById('retry').addEventListener('click', function () {
        window.location.reload();
      });
    </script>
  </body>
</html>
