  <!-- Sand & Steel - the gladius-and-laurel device on deep stone.
       Master artwork for the installable web app icons. The PNG rasters are
       generated from this file, so the art can be replaced later without
       touching code:
         rsvg-convert -w 512 -h 512 icon-source.svg -o icon-512.png
         rsvg-convert -w 512 -h 512 icon-source.svg -o icon-maskable-512.png
         rsvg-convert -w 192 -h 192 icon-source.svg -o icon-192.png
         rsvg-convert -w 180 -h 180 icon-source.svg -o apple-touch-icon.png
       Every drawn point stays inside a centred circle of 80% of the canvas,
       so the one mark is safe for both "any" and "maskable" icons. -->
  <defs>
    <radialGradient id="stone" cx="50%" cy="42%" r="78%">
      <stop offset="0" stop-color="#1d1917"/>
      <stop offset="0.6" stop-color="#141110"/>
      <stop offset="1" stop-color="#0c0a09"/>
    </radialGradient>
    <linearGradient id="bronze" gradientUnits="userSpaceOnUse" x1="0" y1="60" x2="0" y2="456">
      <stop offset="0" stop-color="#f6d27a"/>
      <stop offset="0.5" stop-color="#c9902f"/>
      <stop offset="1" stop-color="#8a5a16"/>
    </linearGradient>
    <linearGradient id="steel" gradientUnits="userSpaceOnUse" x1="228" y1="0" x2="284" y2="0">
      <stop offset="0" stop-color="#6f7b88"/>
      <stop offset="0.42" stop-color="#eef3f8"/>
      <stop offset="0.62" stop-color="#b9c4cf"/>
      <stop offset="1" stop-color="#5f6a76"/>
    </linearGradient>
    <linearGradient id="grip" gradientUnits="userSpaceOnUse" x1="238" y1="0" x2="274" y2="0">
      <stop offset="0" stop-color="#4a2a12"/>
      <stop offset="0.5" stop-color="#8a5524"/>
      <stop offset="1" stop-color="#3a2010"/>
    </linearGradient>
  </defs>
