name: Main quality gate

on:
  push:
    branches:
      - recovery-main-gold-guards
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: main-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Tests, TypeScript, and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run test suite
        run: bun test

      - name: Check TypeScript
        run: bun run lint

      - name: Build production app and verify startup assets
        run: bun run build
