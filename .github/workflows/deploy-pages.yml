# Sand & Steel — publish the production build to GitHub Pages.
#
# Runs the same gates the release checklist uses (suite, typecheck, build), then
# uploads `dist/` as the Pages artifact. Nothing is published unless all three pass.
#
# SERVING PATH (L25 — every asset is base-relative now)
# GitHub Pages serves a *project* site from a subpath (https://<owner>.github.io/<repo>/).
# The app no longer assumes it owns the domain root: `src/utils/assetUrl.ts` prefixes
# every model/audio/sign/icon URL with the build's base, `index.html` and the manifest
# use the same base, and the service worker derives it from its own script URL. Either
# target works, and no code change is needed to switch between them:
#
#   * project site (the default below) — base `/<repo>/`, no DNS or cost;
#   * custom domain or a user/org site (`<owner>.github.io`) — set the repository
#     variable `PAGES_BASE_PATH` to `/`.
#
# `PAGES_BASE_PATH` still wins when set, so a custom domain needs a setting, not an edit.
name: Deploy alpha to GitHub Pages

on:
  # Deliberately `main` only: pushing a feature branch must never publish.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install from the committed lockfile
        run: bun install --frozen-lockfile

      - name: Test suite
        run: bun test

      - name: Typecheck
        run: bun run lint

      # BUILD_COMMIT freezes this exact revision into the bundle, so the title
      # screen prints "Alpha 1.0 · <sha>" for the commit that produced it.
      - name: Build
        env:
          BUILD_COMMIT: ${{ github.sha }}
          BASE_PATH: ${{ vars.PAGES_BASE_PATH || format('/{0}/', github.event.repository.name) }}
        run: bun run build

      # Fails the build rather than shipping a site whose icon and title art 404:
      # `%BASE_URL%` is a build-time token, so any that survives into `dist/` means
      # the base never reached the HTML.
      - name: Assert the base token was resolved
        run: |
          if grep -q '%BASE_URL%' dist/index.html; then
            echo 'index.html still contains %BASE_URL% — the build base did not resolve.'
            exit 1
          fi

      # GitHub Pages answers an unknown path with 404.html. The game has no router —
      # `src/main.tsx` decides what to mount from the address — and /privacy and
      # /delete-account are the two URLs a store listing points at, so publishing the
      # shell as 404.html keeps both alive at a subpath (and at the root).
      - name: Publish the shell for deep links
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
