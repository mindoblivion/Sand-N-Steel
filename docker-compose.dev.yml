# Local development environment for Sand & Steel.
# Runs the Vite dev server from the checked-out source on host port 3000.
# Android builds are produced separately by the GitHub Actions release workflow.

services:
  web:
    image: oven/bun:1
    working_dir: /app
    command: ["sh", "-ec", "bun install --frozen-lockfile && exec bun run dev"]
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    restart: on-failure
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s

volumes:
  web_node_modules:
