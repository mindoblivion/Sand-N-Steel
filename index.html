<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0c0a09" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sand & Steel: 3D Gladiator Arena RPG</title>
    <meta name="description" content="Rise from the slave pits to become the greatest gladiator in Rome. 3D WebGL combat RPG." />
    <!-- Google Fonts for Ancient Roman & Action RPG Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

    <!--
      START-1 — the boot shell. This is the first thing that paints, before any bundle
      or stylesheet has loaded, and it is removed by src/utils/bootShell.ts once React
      has mounted. Two things it must never do: flash white, and hand over to a
      different picture than the title screen itself shows.

      - The field colour is the PWA manifest's `background_color` (#0c0a09), matched by
        the `theme-color` meta above, so the installed-app splash, this shell and the
        title screen are all the same near-black.
      - The art is the SAME rule the title screen uses (`.title-backdrop`): the WebP
        primary with the PNG as the fallback, and the same 20% black scrim TitleScreen
        paints over it. Keep the two in step — this is the shared source of truth for
        both, because index.css (loaded by the bundle) is not available this early.
    -->
    <style>
      html,
      body {
        margin: 0;
        background-color: #0c0a09;
      }

      .title-backdrop {
        background-color: #0c0a09;
        background-image: url(/title_screen.png);
        background-image: image-set(
          url(/title_screen.webp) type("image/webp"),
          url(/title_screen.png) type("image/png")
        );
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      }

      .colosseum-loading-backdrop {
        background-color: #0c0a09;
        background-image: url(/colosseum_loading.png);
        background-image: image-set(
          url(/colosseum_loading.webp) type("image/webp"),
          url(/colosseum_loading.png) type("image/png")
        );
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      }

      #boot-shell {
        position: fixed;
        inset: 0;
        z-index: 100;
        transition: opacity 0.3s ease-out;
      }

      #boot-shell::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 0;
        background: rgba(0, 0, 0, 0.2);
      }

      /* A truthful indeterminate indicator: it sweeps while the app bundle mounts,
         rather than showing a made-up percentage for work we cannot measure. */
      #boot-progress {
        position: absolute;
        z-index: 1;
        left: 50%;
        bottom: max(5.5vh, calc(env(safe-area-inset-bottom, 0px) + 28px));
        width: min(72vw, 420px);
        transform: translateX(-50%);
        color: rgba(245, 222, 179, 0.92);
        text-align: center;
        font: 700 10px/1.2 "Rajdhani", sans-serif;
        letter-spacing: 0.28em;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.9);
        pointer-events: none;
      }

      #boot-progress-label {
        display: block;
        margin-bottom: 9px;
      }

      #boot-progress-track {
        height: 4px;
        overflow: hidden;
        border: 1px solid rgba(180, 83, 9, 0.55);
        border-radius: 999px;
        background: rgba(12, 10, 9, 0.78);
        box-shadow: 0 0 12px rgba(180, 83, 9, 0.2);
      }

      #boot-progress-fill {
        width: 34%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #8f4b18, #f5d28a, #b45309);
        box-shadow: 0 0 9px rgba(245, 158, 11, 0.75);
        animation: boot-progress-sweep 1.45s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @keyframes boot-progress-sweep {
        0% { transform: translateX(-110%); }
        50% { transform: translateX(95%); }
        100% { transform: translateX(300%); }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-progress-fill {
          animation: none;
          transform: translateX(95%);
        }
      }

      #boot-shell.boot-shell-out {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body class="bg-neutral-950 text-amber-100 overflow-hidden select-none">
    <div id="boot-shell" class="title-backdrop" aria-hidden="true">
      <div id="boot-progress" aria-hidden="true">
        <span id="boot-progress-label">LOADING</span>
        <div id="boot-progress-track">
          <div id="boot-progress-fill"></div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
